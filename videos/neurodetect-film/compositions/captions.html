  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-0" class="cap clip" data-start="1.85" data-duration="1.22"><span>The brain never</span></div>
    <div id="cap-1" class="cap clip" data-start="3.09" data-duration="1.43"><span>stops talking.</span></div>
    <div id="cap-2" class="cap clip" data-start="4.54" data-duration="1.64"><span>Billions of cells,</span></div>
    <div id="cap-3" class="cap clip" data-start="6.2" data-duration="2.9"><span>signalling in tiny pulses of electricity.</span></div>
    <div id="cap-4" class="cap clip" data-start="9.23" data-duration="2.05"><span>Those signals leave a trace.</span></div>
    <div id="cap-5" class="cap clip" data-start="11.32" data-duration="1.51"><span>Can we learn to read them?</span></div>
    <div id="cap-6" class="cap clip" data-start="14.75" data-duration="1.94"><span>Alzheimer&#x27;s disease is the</span></div>
    <div id="cap-7" class="cap clip" data-start="16.71" data-duration="1.82"><span>most common cause of dementia,</span></div>
    <div id="cap-8" class="cap clip" data-start="18.55" data-duration="1.17"><span>and it is often</span></div>
    <div id="cap-9" class="cap clip" data-start="19.74" data-duration="1.56"><span>recognised late.</span></div>
    <div id="cap-10" class="cap clip" data-start="21.32" data-duration="1.86"><span>The tests that confirm it are</span></div>
    <div id="cap-11" class="cap clip" data-start="23.2" data-duration="1.94"><span>costly, and specialists</span></div>
    <div id="cap-12" class="cap clip" data-start="25.16" data-duration="1.09"><span>are scarce.</span></div>
    <div id="cap-13" class="cap clip" data-start="26.27" data-duration="1.77"><span>In low-income countries,</span></div>
    <div id="cap-14" class="cap clip" data-start="28.06" data-duration="1.0"><span>there is about one</span></div>
    <div id="cap-15" class="cap clip" data-start="29.08" data-duration="2.62"><span>neurology specialist for every million people.</span></div>
    <div id="cap-17" class="cap clip" data-start="31.72" data-duration="1.3"><span>An EEG is</span></div>
    <div id="cap-18" class="cap clip" data-start="33.04" data-duration="0.84"><span>different.</span></div>
    <div id="cap-19" class="cap clip" data-start="33.9" data-duration="1.34"><span>It is cheap,</span></div>
    <div id="cap-20" class="cap clip" data-start="35.26" data-duration="1.52"><span>painless, and already</span></div>
    <div id="cap-21" class="cap clip" data-start="36.8" data-duration="1.57"><span>in most hospitals.</span></div>
    <div id="cap-22" class="cap clip" data-start="40.65" data-duration="2.5"><span>NeuroDetect reads one short,</span></div>
    <div id="cap-23" class="cap clip" data-start="43.17" data-duration="1.9"><span>resting EEG recording.</span></div>
    <div id="cap-24" class="cap clip" data-start="45.09" data-duration="2.28"><span>It needs just five of the usual</span></div>
    <div id="cap-26" class="cap clip" data-start="47.39" data-duration="1.39"><span>nineteen sensors.</span></div>
    <div id="cap-27" class="cap clip" data-start="48.8" data-duration="2.11"><span>Three for Alzheimer&#x27;s-type changes,</span></div>
    <div id="cap-28" class="cap clip" data-start="50.93" data-duration="2.02"><span>and two for a mood marker.</span></div>
    <div id="cap-29" class="cap clip" data-start="54.25" data-duration="1.52"><span>Here is the journey of one</span></div>
    <div id="cap-30" class="cap clip" data-start="55.79" data-duration="1.11"><span>recording.</span></div>
    <div id="cap-31" class="cap clip" data-start="56.98" data-duration="1.47"><span>The signal is filtered</span></div>
    <div id="cap-32" class="cap clip" data-start="58.47" data-duration="1.69"><span>to between half a hertz</span></div>
    <div id="cap-33" class="cap clip" data-start="60.18" data-duration="1.43"><span>and forty-five hertz,</span></div>
    <div id="cap-34" class="cap clip" data-start="61.63" data-duration="2.2"><span>and resampled to two hundred and</span></div>
    <div id="cap-35" class="cap clip" data-start="63.85" data-duration="1.68"><span>fifty samples a second.</span></div>
    <div id="cap-36" class="cap clip" data-start="65.6" data-duration="1.3"><span>Then it is cut into</span></div>
    <div id="cap-37" class="cap clip" data-start="66.92" data-duration="1.56"><span>ten-second slices.</span></div>
    <div id="cap-38" class="cap clip" data-start="68.55" data-duration="2.32"><span>Slices spoiled by blinks or movement</span></div>
    <div id="cap-39" class="cap clip" data-start="70.89" data-duration="1.61"><span>are thrown away.</span></div>
    <div id="cap-40" class="cap clip" data-start="72.52" data-duration="1.38"><span>Every clean slice</span></div>
    <div id="cap-41" class="cap clip" data-start="73.92" data-duration="1.69"><span>becomes a few numbers,</span></div>
    <div id="cap-42" class="cap clip" data-start="75.63" data-duration="2.37"><span>called biomarkers, and each slice</span></div>
    <div id="cap-43" class="cap clip" data-start="78.02" data-duration="1.83"><span>is judged on its own.</span></div>
    <div id="cap-44" class="cap clip" data-start="81.21" data-duration="1.94"><span>Two paths run side</span></div>
    <div id="cap-45" class="cap clip" data-start="83.17" data-duration="1.41"><span>by side.</span></div>
    <div id="cap-46" class="cap clip" data-start="84.62" data-duration="2.41"><span>The Alzheimer&#x27;s path compares slow theta</span></div>
    <div id="cap-47" class="cap clip" data-start="87.05" data-duration="1.6"><span>waves with alpha waves</span></div>
    <div id="cap-48" class="cap clip" data-start="88.67" data-duration="1.26"><span>at the back of the head,</span></div>
    <div id="cap-49" class="cap clip" data-start="89.95" data-duration="2.2"><span>and checks how closely the front</span></div>
    <div id="cap-50" class="cap clip" data-start="92.17" data-duration="1.26"><span>and back of the brain</span></div>
    <div id="cap-51" class="cap clip" data-start="93.45" data-duration="1.08"><span>stay in step.</span></div>
    <div id="cap-52" class="cap clip" data-start="94.55" data-duration="1.0"><span>The second path</span></div>
    <div id="cap-53" class="cap clip" data-start="95.57" data-duration="2.54"><span>measures frontal alpha asymmetry,</span></div>
    <div id="cap-54" class="cap clip" data-start="98.13" data-duration="2.29"><span>a depression-related marker.</span></div>
    <div id="cap-55" class="cap clip" data-start="100.44" data-duration="1.56"><span>It is preliminary,</span></div>
    <div id="cap-56" class="cap clip" data-start="102.02" data-duration="1.21"><span>and shown as indicative</span></div>
    <div id="cap-57" class="cap clip" data-start="103.25" data-duration="0.85"><span>only.</span></div>
    <div id="cap-58" class="cap clip" data-start="105.65" data-duration="1.94"><span>The classifier is deliberately</span></div>
    <div id="cap-59" class="cap clip" data-start="107.61" data-duration="0.92"><span>simple.</span></div>
    <div id="cap-60" class="cap clip" data-start="108.55" data-duration="1.73"><span>It learns one typical</span></div>
    <div id="cap-61" class="cap clip" data-start="110.3" data-duration="2.07"><span>healthy pattern and one typical</span></div>
    <div id="cap-62" class="cap clip" data-start="112.39" data-duration="2.54"><span>Alzheimer&#x27;s pattern, and asks</span></div>
    <div id="cap-63" class="cap clip" data-start="114.95" data-duration="1.43"><span>which a slice is closer</span></div>
    <div id="cap-64" class="cap clip" data-start="116.4" data-duration="2.46"><span>to, using cosine distance.</span></div>
    <div id="cap-65" class="cap clip" data-start="119.05" data-duration="2.16"><span>Every slice casts a vote.</span></div>
    <div id="cap-66" class="cap clip" data-start="121.23" data-duration="0.88"><span>The whole model</span></div>
    <div id="cap-67" class="cap clip" data-start="122.13" data-duration="1.69"><span>holds just sixteen learned</span></div>
    <div id="cap-68" class="cap clip" data-start="123.84" data-duration="2.75"><span>parameters, about one kilobyte,</span></div>
    <div id="cap-69" class="cap clip" data-start="126.61" data-duration="2.6"><span>and runs on an ordinary laptop.</span></div>
    <div id="cap-70" class="cap clip" data-start="130.25" data-duration="1.68"><span>Tested on sixty-five people</span></div>
    <div id="cap-71" class="cap clip" data-start="131.95" data-duration="1.18"><span>it had never seen,</span></div>
    <div id="cap-72" class="cap clip" data-start="133.15" data-duration="1.86"><span>and repeated ten times,</span></div>
    <div id="cap-73" class="cap clip" data-start="135.03" data-duration="1.68"><span>the Alzheimer&#x27;s module reached</span></div>
    <div id="cap-74" class="cap clip" data-start="136.73" data-duration="1.52"><span>eighty-two point six percent</span></div>
    <div id="cap-75" class="cap clip" data-start="138.27" data-duration="2.2"><span>balanced accuracy, and correctly</span></div>
    <div id="cap-76" class="cap clip" data-start="140.49" data-duration="1.39"><span>cleared ninety-four percent</span></div>
    <div id="cap-77" class="cap clip" data-start="141.9" data-duration="1.18"><span>of healthy people.</span></div>
    <div id="cap-78" class="cap clip" data-start="143.1" data-duration="2.41"><span>Three electrodes beat the full nineteen.</span></div>
    <div id="cap-79" class="cap clip" data-start="145.53" data-duration="1.43"><span>The depression marker scored</span></div>
    <div id="cap-80" class="cap clip" data-start="146.98" data-duration="1.56"><span>fifty-five percent:</span></div>
    <div id="cap-81" class="cap clip" data-start="148.6" data-duration="1.53"><span>close to chance.</span></div>
    <div id="cap-82" class="cap clip" data-start="151.75" data-duration="2.65"><span>And it is a working prototype.</span></div>
    <div id="cap-84" class="cap clip" data-start="154.44" data-duration="1.38"><span>Upload a recording,</span></div>
    <div id="cap-85" class="cap clip" data-start="155.84" data-duration="1.05"><span>and within seconds</span></div>
    <div id="cap-86" class="cap clip" data-start="156.91" data-duration="1.6"><span>you get a plain-language</span></div>
    <div id="cap-87" class="cap clip" data-start="158.53" data-duration="2.54"><span>verdict, the vote of every slice,</span></div>
    <div id="cap-88" class="cap clip" data-start="161.09" data-duration="1.22"><span>the measurements behind</span></div>
    <div id="cap-89" class="cap clip" data-start="162.33" data-duration="1.34"><span>it, and a P D F</span></div>
    <div id="cap-90" class="cap clip" data-start="163.69" data-duration="0.86"><span>report.</span></div>
    <div id="cap-91" class="cap clip" data-start="165.75" data-duration="2.41"><span>NeuroDetect is a screening aid,</span></div>
    <div id="cap-92" class="cap clip" data-start="168.18" data-duration="1.81"><span>not a diagnosis.</span></div>
    <div id="cap-93" class="cap clip" data-start="170.01" data-duration="1.91"><span>Before it is used in clinics,</span></div>
    <div id="cap-94" class="cap clip" data-start="171.94" data-duration="2.11"><span>it needs testing on data from</span></div>
    <div id="cap-95" class="cap clip" data-start="174.07" data-duration="1.5"><span>other hospitals.</span></div>
    <div id="cap-96" class="cap clip" data-start="176.65" data-duration="1.66"><span>NeuroDetect.</span></div>
    <div id="cap-97" class="cap clip" data-start="178.44" data-duration="1.82"><span>Making brain-wave screening</span></div>
    <div id="cap-98" class="cap clip" data-start="180.28" data-duration="2.0"><span>more accessible.</span></div>
