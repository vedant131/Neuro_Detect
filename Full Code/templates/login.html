{% extends "base.html" %}
{% block title %}Log in - NeuroDetect{% endblock %}
{% block content %}
<section class="block">
    <div class="wrap">
        <div class="sheet form" style="max-width:480px">
            <h1 style="font-size:2rem">Log in</h1>
            <p class="small">Log in to upload a recording and get a report. Recordings stay private to your account.</p>
            <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <div class="btn-row"><button type="submit" class="btn">Log in</button></div>
            </form>
            <p class="small" style="margin-top:20px">New here? <a href="{{ url_for('register') }}"><b>Create an account</b></a></p>
        </div>
    </div>
</section>
{% endblock %}
